const aboutTracker=`<section class="about-tracker"><div class="wrap"><div class="tracker-head center"><div><span class="eyebrow" style="color:#d7c4b3">THE VELOURA METHOD</span><h2 style="color:#fff">How our philosophy becomes a ritual.</h2><p style="max-width:700px;margin:0 auto;color:#cfd9d0">A simple four-stage journey built around listening, thoughtful curation, comfortable care and routines that evolve with you.</p></div></div><div class="tracker-shell"><div class="tracker-head"><span class="tracker-live"><i class="live-dot"></i> BRAND JOURNEY</span><strong>82% refined</strong></div><div class="tracker-line"><span class="tracker-progress"></span><span class="tracker-marker"></span></div><div class="tracker-steps"><div class="tracker-step"><strong>01 · Listen</strong><span>Your texture, habits & goals</span></div><div class="tracker-step"><strong>02 · Curate</strong><span>Essentials chosen with intention</span></div><div class="tracker-step"><strong>03 · Care</strong><span>Comfort-first rituals & service</span></div><div class="tracker-step"><strong>04 · Evolve</strong><span>Small changes, better routines</span></div></div><div class="tracker-metrics"><div class="tracker-metric"><b>4</b><span>Guiding stages</span></div><div class="tracker-metric"><b>1:1</b><span>Personal approach</span></div><div class="tracker-metric"><b>∞</b><span>Ways to make it yours</span></div></div></div></div></section>`;
const pages={
home:()=>`<section class="hero"><div class="hero-copy"><span class="eyebrow">DISCOVER YOUR BEST HAIR DAYS</span><div class="hero-title-wrap"><span class="hero-strand" aria-hidden="true"><i></i></span><h1 class="shine hero-title" data-magnetic>YOUR HAIR.<br><span>YOUR RITUAL.</span></h1><span class="hero-drag-label" aria-hidden="true">LIVE RITUAL</span></div><p>Elevated hair care, expert-led services and thoughtfully chosen essentials for every texture and every day.</p><div class="hero-actions">${btn('Explore the collection','shop')} <a class="btn outline" href="#quiz">Find my ritual →</a></div></div><div class="hero-visual"><img src="${img(photos.hero,1500)}" alt="Premium hair care portrait"></div></section>${rail}${tracker}${section('Care that feels like you','Find beautifully simple essentials designed around how you really care for your hair.',`<div class="grid">${card('Cleanse & Reset','Refresh your routine with gentle formulas.','shampoo',btn('Shop cleanse','shop'))}${card('Nourish & Restore','Indulgent moisture for a softer finish.','mask',btn('Explore masks','shop'))}${card('Scalp & Roots','Make scalp care part of your ritual.','scalp',btn('Find your care','quiz'))}</div>`)}${split('A little science. A lot of self-care.','Our guided hair profile helps you explore a routine based on your texture, goals and preferences. No complicated beauty jargon.', 'care',btn('Take the hair quiz','quiz'))}${section('Meet your new favorites','Sixteen thoughtfully selected rituals for wash day and beyond.',`<div class="grid four">${product.map(([n,d,p,k],i)=>card(n,d,k,`<p class="price">$${p}.00</p><button class="btn" onclick="add(${i})">Add to bag +</button>`)).join('')}</div>`,'band')}${split('Salon moments, made personal','Book a styling or conditioning experience that fits your hair goals and your calendar. Demo appointment requests are confirmed on screen only.','service',btn('Explore services','services'),true)}${section('Real routines. Beautiful stories.','Browse an ed subscriptions:()=>`${hero('Ritual Subscriptions','Your essentials, delivered on a schedule that suits you.','oil')}${section('Replenishment, simplified','Explore example subscription plans. No payments or recurring deliveries are activated.',`<div class="grid">${[['Monthly Glow','$24 / month','Every 30 days'],['Everyday Ritual','$44 / month','Every 45 days'],['Seasonal Reset','$68 / quarter','Every 90 days']].map(([n,p,d])=>`<div class="tile tile-body reveal"><span class="eyebrow">FLEXIBLE BEAUTY</span><h3>${n}</h3><h2>${p}</h2><p>${d} · demo pricing</p><button class="btn" onclick="toast('Demo plan selected: ${n}. No subscription was created.')">Choose plan</button></div>`).join('')}</div>`)}${split('Made for your rhythm','A flexible concept for consistent routines without last-minute restocking. Real billing and delivery require a commerce backend.','shampoo',btn('Browse products','shop'))}${section('Frequently asked questions','Learn how a real subscription service could work.',`<div class="accordion"><details><summary>Can I pause a delivery?</summary><p>In a production store, customers could manage deliveries from their account. This demo has no live account system.</p></details><details><summary>Can I switch products?</summary><p>A real subscription engine could support product changes before each shipment.</p></details><details><summary>Is checkout active?</summary><p>No. All prices and plans are illustrative.</p></details></div>`,'band')}`,

about:()=>`${hero('Our Story','Intentional beauty, inspired by real everyday rituals.','about')}${split('A softer approach to hair care','Veloura is a fictional premium beauty concept built around welcoming experiences, straightforward routines and timeless visual design.','ritual')}${section('What guides us','Thoughtful details make the difference.',`<div class="grid">${card('Care first','Comfortable, inclusive experiences.','care')}${card('Beauty with intention','Curated essentials and mindful routines.','serum')}${card('Your individuality','A ritual that works for you.','portrait')}</div>`,'band')}${aboutTracker}${split('The beauty of consistency','From discovery to daily use, the best routine is one you enjoy returning to.','oil',btn('Start your ritual','quiz'),true)}`,
booking:()=>`${hero('Book Your Ritual','Request a preferred service, date and time.','consult')}${section('Your next beauty moment','This is a demonstration booking form; no actual appointment is reserved.',`<form class="form" onsubmit="submitDemo(event,'Booking request recorded locally. No real appointment was made.')"><input required aria-label="Your name" placeholder="Full name"><input required type="email" aria-label="Email" placeholder="Email address"><select required aria-label="Service"><option value="">Choose a service</option>${service.map(([n])=>`<option>${n}</option>`).join('')}</select><input required type="date" aria-label="Preferred date" min="${new Date().toISOString().slice(0,10)}"><input required type="time" aria-label="Preferred time"><textarea placeholder="Tell us about your hair goals" aria-label="Notes"></textarea><button class="btn" type="submit">Request appointment →</button></form>`)}${split('A little preparation','Bring inspiration photos and share any product sensitivities during a real consultation.','styling',btn('Explore services','services'))}${section('A thoughtful experience','From arrival to the final finishing touch.',`<div class="grid">${card('Consult','Tell us your preferences.','consult')}${card('Care','Enjoy your selected ritual.','spa')}${card('Style','Finish your look.','styling')}</div>`,'band')}`,
contact:()=>`${hero('Get in Touch','We would love to hear from you. All contact information is fictional.','gallery2')}<section><div class="wrap contact-grid"><div class="contact-info reveal"><h2>Say hello.</h2><p><strong>Email</strong><br>hello@veloura.example</p><p><strong>Phone</strong><br>+1 (202) 555-0147</p><p><strong>Address</strong><br>123 Example Avenue, New York, NY (fictional)</p><div class="social"><a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a><a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.8 22v-9h3l.5-4h-3.5V6.5c0-1.2.3-2 2-2h1.7V.9A23 23 0 0 0 15 0c-3 0-5 1.8-5 5.2V9H7v4h3v9z"/></svg></a><a href="https://www.pinterest.com/" target="_blank" rel="noopener" aria-label="Pinterest"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.6 19.3c0-.8 0-1.7.2-2.6l1.2-5.1s-.3-.6-.3-1.6c0-1.5.9-2.7 2-2.7.9 0 1.4.7 1.4 1.5 0 .9-.6 2.3-.9 3.6-.3 1.1.6 2 1.7 2 2 0 3.5-2.1 3.5-5.2 0-2.7-1.9-4.5-4.6-4.5-3.2 0-5.1 2.4-5.1 4.9 0 1 .4 2 1 2.6l-.4 1.7c-1.3-.6-2.1-2.3-2.1-4.4 0-3.5 2.9-6.8 7.4-6.8 3.9 0 6.9 2.8 6.9 6.5 0 3.9-2.5 7-5.9 7-1.2 0-2.3-.6-2.7-1.3l-.8 3c-.3 1.1-1.1 2.4-1.6 3.3A10 10 0 1 0 12 2z"/></svg></a></div></div><div class="reveal"><h2 class="center">Send a message</h2><form class="form" onsubmit="submitDemo(event,'Demo message received locally. Nothing was sent.')"><input required placeholder="Your name" aria-label="Name"><input required type="email" placeholder="Your email" aria-label="Email"><input required placeholder="Subject" aria-label="Subject"><textarea required placeholder="Your message" aria-label="Message"></textarea><button class="btn">Send message →</button></form></div></div></section><section class="band"><div class="wrap center"><h2>Find the neighborhood</h2><p>Interactive OpenStreetMap view of central New York; no real store location is implied.</p><iframe class="map" loading="lazy" title="Map of New York" src="https://www.openstreetmap.org/export/embed.html?bbox=-74.015%2C40.705%2C-73.985%2C40.725&layer=mapnik"></iframe></div></section>`,
cart:()=>`${hero('Your Beauty Bag','A simple local demo cart with no payment processing.','mask')}${section('Your selected rituals','Your bag is stored only for this browser session.',`<div id="cartbody" class="center"></div>`)}${split('Keep discovering','Find the hair care essentials that fit your daily routine.','oil',btn('Continue shopping','shop'))}`};
let cart=JSON.parse(sessionStorage.getItem('velouraCart')||'[]');function add(i){cart.push(i);sessionStorage.setItem('velouraCart',JSON.stringify(cart));updateCount();toast(product[i][0]+' added to bag.')}function updateCount(){document.getElementById('count').textContent=cart.length}function toast(t){const n=document.getElementById('toast');n.textContent=t;n.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.remove('show'),3500)}function submitDemo(e,msg){e.preventDefault();e.target.reset();toast(msg)}function filterProducts(){const checked=document.getElementById('sulfate')?.checked;document.getElementById('products').innerHTML=product.map(([n,d,p,k],i)=>!checked||i!==3?card(n,d,k,`<p class="price">$${p}.00</p><button class="btn" onclick="add(${i})">Add to bag +</button>`):'').join('');observe()}function renderCart(){let box=document.getElementById('cartbody');if(!box)return;if(!cart.length){box.innerHTML=`<p>Your bag is empty.</p>${btn('Discover products','shop')}`;return}let sum=cart.reduce((a,i)=>a+product[i][2],0);box.innerHTML=`${cart.map((i,j)=>`<p>${product[i][0]} — $${product[i][2]} <button class="btn outline" onclick="removeCart(${j})">Remove</button></p>`).join('')}<h3>Demo total: $${sum}.00</h3><button class="btn" onclick="toast('Checkout is not connected in this demo.')">Continue to checkout →</button>`}function removeCart(j){cart.splice(j,1);sessionStorage.setItem('velouraCart',JSON.stringify(cart));updateCount();renderCart()}
const questions=[['What best describes your hair?',['Straight','Wavy','Curly','Coily']],['What is your main goal?',['Hydration','Shine','Scalp comfort','Gentle cleansing']],['How often do you wash?',['Daily','Every few days','Weekly']]];let qi=0,answers=[];function renderQuiz(){const q=document.getElementById('question');if(!q)return;if(qi>=questions.length){const goal=answers[1];const rec=goal===0?1:goal===1?3:goal===2?2:0;document.getElementById('quizbox').innerHTML=`<h3>Your suggested ritual</h3><p>Explore ${product[rec][0]} based on your selections.</p>${btn('Shop your suggestion','shop')} <button class="btn outline" onclick="qi=0;answers=[];navigate('quiz')">Start again</button>`;return}q.textContent=questions[qi][0];document.getElementById('answers').innerHTML=questions[qi][1].map((a,i)=>`<button class="quiz-option ${answers[qi]===i?'selected':''}" onclick="chooseQuiz(${i})">${a}</button>`).join('');document.getElementById('nextQuiz').disabled=answers[qi]===undefined;document.getElementById('nextQuiz').textContent=qi===2?'See my ritual →':'Continue →'}function chooseQuiz(i){answers[qi]=i;renderQuiz()}function nextQuiz(){if(answers[qi]===undefined)return;qi++;renderQuiz()}let magneticCleanup=null;function setupHeroMotion(){if(magneticCleanup)magneticCleanup();const el=document.querySelector('[data-magnetic]');if(!el)return;const wrap=el.closest('.hero-title-wrap');if(!wrap)return;const move=e=>{const r=wrap.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`translate(${x*10}px,${y*7}px)`};const leave=()=>{el.style.transform='translate(0,0)'};wrap.addEventListener('pointermove',move);wrap.addEventListener('pointerleave',leave);magneticCleanup=()=>{wrap.removeEventListener('pointermove',move);wrap.removeEventListener('pointerleave',leave)};}
let observer;function observe(){observer?.disconnect();observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');observer.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach((e,i)=>{e.style.transitionDelay=(i%4)*85+'ms';observer.observe(e)})}function navigate(force){const page=force||location.hash.slice(1)||'home';const p=pages[page]?page:'home';document.getElementById('app').innerHTML=pages[p]();document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+p));document.getElementById('links').classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false');window.scrollTo(0,0);observe();setupHeroMotion();if(p==='quiz'){qi=0;answers=[];renderQuiz()}if(p==='cart')renderCart();document.title=(p==='home'?'Veloura':p[0].toUpperCase()+p.slice(1)+' | Veloura')+' — Hair Rituals'}document.querySelector('.menu').onclick=()=>{let el=document.getElementById('links');el.classList.toggle('open');document.querySelector('.menu').setAttribute('aria-expanded',el.classList.contains('open'))};window.addEventListener('hashchange',()=>navigate());updateCount();navigate();
</script></body></html>
